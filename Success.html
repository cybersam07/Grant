<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Registration Successful</title> <!-- Automatically redirect after 2 seconds --> <meta http-equiv="refresh" content="2;url=https://ln.run/zoom"> <style> :root { --primary: #1a4480; --primary-dark: #162e51; --text: #1b1b1b; --muted: #565c65; --background: #f5f5f5; --white: #fff; --border: #dfe1e2; } * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--background); } .site-header { background: var(--white); border-bottom: 1px solid var(--border); } .header-inner { width: min(1100px, calc(100% - 32px)); margin: auto; min-height: 90px; display: flex; align-items: center; } .logo { color: var(--primary-dark); font-size: 1.5rem; font-weight: 700; text-decoration: none; } main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; } .card { width: min(600px, 100%); padding: 40px; text-align: center; background: var(--white); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 8%); } .checkmark { width: 64px; height: 64px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: white; background: #237a3b; font-size: 2rem; font-weight: 700; } h1 { margin: 0 0 12px; color: var(--primary-dark); } p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; } .button { display: inline-block; padding: 12px 22px; border-radius: 4px; color: var(--white); background: var(--primary); text-decoration: none; font-weight: 700; } .button:hover { background: var(--primary-dark); } .footer { padding: 24px; text-align: center; color: var(--muted); font-size: .9rem; } </style> </head> <body> <header class="site-header"> <div class="header-inner"> <a class="logo"
